# 在 GitHub Actions 上构建 lowhub 安卓 APK。
# 流程按 BUILDING.md 的 Android 章节：先从源码构建原生依赖
# （PRoot、Alpine rootfs、rclone），再跑 Gradle assembleRelease。
# 签名：配置了 LOWHUB_KEYSTORE_BASE64 secret 时用固定密钥签名（构建之间可互相
# 覆盖安装）；未配置时工程回退到 debug 签名，产物仍可直接安装。
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: 准备 Android SDK 命令行工具
        uses: android-actions/setup-android@v3
        with:
          # 该步骤默认会装 "tools platform-tools"，其中旧 tools 包已被 Google
          # 从 SDK 仓库下架（sdkmanager 报 Failed to find package 'tools'），
          # 故显式只装 platform-tools。
          packages: platform-tools

      - name: 安装 SDK 组件（platform 36 / build-tools / CMake / NDK r28）
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: 安装原生构建需要的系统工具
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config bison flex gettext ninja-build

      - name: 安装 gomobile
        run: |
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: 生成构建期配置文件（留空即可编译运行）
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: 构建原生依赖（PRoot / 沙箱 rootfs / rclone）
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      # 固定签名密钥（可选）：把 secret 里的 base64 密钥库解码到临时目录，
      # 并把 build.gradle.kts 读取的四个环境变量写进 $GITHUB_ENV。secret 为空
      # 时只警告并继续，Gradle 侧会自动回退到 debug 签名。
      - name: 准备固定签名密钥（可选）
        run: |
          if [ -n "${{ secrets.LOWHUB_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.LOWHUB_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lowhub.keystore"
            {
              echo "LOWHUB_KEYSTORE_FILE=$RUNNER_TEMP/lowhub.keystore"
              echo "LOWHUB_KEYSTORE_PASSWORD=${{ secrets.LOWHUB_KEYSTORE_PASSWORD }}"
              echo "LOWHUB_KEY_ALIAS=lowhub"
              echo "LOWHUB_KEY_PASSWORD=${{ secrets.LOWHUB_KEYSTORE_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "固定签名密钥已就绪，本次构建使用 releaseFixed 签名。"
          else
            echo "警告：未配置 LOWHUB_KEYSTORE_BASE64 secret，本次构建回退到 debug 签名，与固定签名构建不可互相覆盖安装。"
          fi

      - name: Gradle 构建 release APK
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          apk=$(find src/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "找到 APK: $apk"
          test -n "$apk"
          cp "$apk" lowhub.apk
          ls -lh lowhub.apk

      - name: 上传为构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: lowhub-apk
          path: lowhub.apk
          if-no-files-found: error

      - name: 发布到 Release（提供长期直达下载链接）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lowhub-latest
          name: lowhub 最新构建（自动打包）
          body: |
            由 GitHub Actions 自动构建的 lowhub 安卓 APK（arm64，可直接安装；配置了固定签名密钥时可与历史版本互相覆盖安装）。
            下载下面的 lowhub.apk，在手机上允许“安装未知应用”后打开即可安装。
          files: lowhub.apk
          make_latest: true
